name: Windows

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verificar sintaxe
        run: python -m compileall -q app

      - name: Gerar MediaHumanBatch.exe
        run: ./build-exe.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: MediaHumanBatch
          path: dist/MediaHumanBatch.exe

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MediaHumanBatch

      - name: Anexar ao release
        run: gh release upload "$TAG" MediaHumanBatch.exe --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
