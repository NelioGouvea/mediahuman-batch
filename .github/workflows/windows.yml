name: Windows

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Gerar MediaHumanBatch.exe
        run: ./build-exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MediaHumanBatch
          path: dist/MediaHumanBatch.exe

      - name: Anexar ao release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/MediaHumanBatch.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
